<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SonoraRev</title>
    <!-- Favicon: el mismo tocadiscos del logo (desde 1.34.2; antes era la "R" sola), en PNG.
         Sin SVG a propósito: si hay uno, varios navegadores lo prefieren sobre los PNG.
         Nombres con versión (.v3): express.static los sirve sin hash, así que un logo nuevo
         necesita URL nueva para esquivar la caché de favicons. Los genera
         .claude/tools/brand/gen-icons.mjs. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.v3.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.v3.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.v3.png" />

    <!-- PWA (Fase 1: instalable, sin service worker / offline todavía) -->
    <!-- crossorigin="use-credentials": el navegador pide el manifest con las
         credenciales OMITIDAS por defecto, así que detrás de Cloudflare Access
         la petición viaja sin la cookie de sesión y Access responde un 302 al
         login → llega HTML donde se esperaba JSON. Es same-origin, así que no
         hace falta ningún header CORS del servidor. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.v2.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" (opaco) y no "black-translucent": este último superpone el
         status bar al contenido y exigiría auditar safe-area-top en TODAS las
         pantallas (hoy solo cubierto en .player-expanded / chevron / campanita,
         ver mobile-lab). Con "black" no hace falta tocar más CSS en esta fase. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SonoraRev" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
