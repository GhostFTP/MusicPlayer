services:
  musicplayer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true                                  # PID 1 con manejo de señales/zombies
    networks:
      - default                # por aquí cloudflared llega a musicplayer:3000: NO se puede quitar
      - dokploy-network
      - classify-ai_inference  # red interna de CLASSIFY donde vive Ollama
    environment:
      NODE_ENV: production
      PORT: "3000"
      MUSIC_DIR: /music
      # 🎬 Videos (opcional): la carpeta montada abajo. Si falta o no existe, el servidor
      # arranca igual y GET /api/videos responde una lista vacía. Va FUERA de /music a
      # propósito: el escáner de música recorre todo MUSIC_DIR y no tiene por qué ver videos.
      VIDEO_DIR: /videos
      # Falla aposta el arranque si no lo defines en Dokploy (evita el default inseguro)
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en las env vars de Dokploy}
      # Auto-login vía Cloudflare Access (opcional). Si ambas están vacías, el
      # auto-login queda desactivado y solo funciona el login por contraseña.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Login con Google desde la app del teléfono (opcional): el ID del cliente OAuth
      # de iOS. Vacío = POST /api/auth/google responde 503 y todo lo demás sigue igual.
      # Tiene que estar NOMBRADA acá: una variable de Dokploy que el compose no nombra
      # no llega al contenedor.
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      # Ver la contraseña desde el panel (opcional, 1.23.0): la llave base64 de 32 bytes.
      # Vacía = "ver contraseña" no está disponible y el servidor arranca igual.
      PASSWORD_VIEW_KEY: ${PASSWORD_VIEW_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      LOCUTOR_MODELO: ${LOCUTOR_MODELO:-}
      LOCUTOR_KEEP_ALIVE: ${LOCUTOR_KEEP_ALIVE:-}
      LOCUTOR_TIMEOUT_MS: ${LOCUTOR_TIMEOUT_MS:-}
      LOCUTOR_TIMEOUT_FRIO_MS: ${LOCUTOR_TIMEOUT_FRIO_MS:-}
      LOCUTOR_LIMITE_USUARIO_HORA: ${LOCUTOR_LIMITE_USUARIO_HORA:-}
      LOCUTOR_LIMITE_DIA: ${LOCUTOR_LIMITE_DIA:-}
      LOCUTOR_CACHE_MAX: ${LOCUTOR_CACHE_MAX:-}
      LOCUTOR_COLA_MAX: ${LOCUTOR_COLA_MAX:-}
      LOCUTOR_CALENTAR_AL_ARRANCAR: ${LOCUTOR_CALENTAR_AL_ARRANCAR:-}
    volumes:
      # 🎵 Biblioteca de música: host /mnt/storage/Musica → contenedor /music/Musica, SOLO LECTURA.
      #    El ":ro" lo impone el kernel: nada del contenedor puede escribir tu música.
      - /mnt/storage/Musica:/music/Musica:ro
      # 🎬 Videos: host /mnt/storage/Video → contenedor /videos, SOLO LECTURA. Forma:
      #    <Artista>/<Título (año)>.mp4, con la portada al lado (<Título (año)>.jpg).
      - /mnt/storage/Video:/videos:ro
      # 💾 Datos persistentes (music.db + WAL + covers/) entre reinicios/redeploys.
      - musicplayer-data:/app/music-server/data
    expose:
      - "3000"                                  # Dokploy/Traefik enruta el dominio a este puerto
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ☁️ Túnel de Cloudflare (modo token). Expone la app sin abrir puertos en el host.
  #    El dashboard de Cloudflare enruta musica.lapeñadesantiago.com → este túnel,
  #    y el Public Hostname del túnel apunta a http://musicplayer:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Alcanza a la app por NOMBRE de servicio (musicplayer) gracias a la red por
    # defecto del proyecto Compose: estable ante redeploys, sin depender de IPs.
    # El token se inyecta desde Dokploy; si falta, el arranque falla con mensaje claro
    # (mismo patrón que JWT_SECRET en musicplayer).
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?define CLOUDFLARE_TUNNEL_TOKEN en Dokploy}
    depends_on:
      - musicplayer

networks:
  dokploy-network:
    external: true
  classify-ai_inference:
    external: true
    name: classify-ai_inference

volumes:
  musicplayer-data:                             # volumen nombrado gestionado por Docker
